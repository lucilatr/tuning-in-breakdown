  .chip[data-f="music"].active{background:var(--rail)}

  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,#666)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .card h3{font-size:18px;line-height:1.25}
  .star{color:var(--conservatory);font-size:14px}

  .card .elems{margin-top:12px;font-size:13px;color:var(--muted)}

  footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}

</head>

let LANG=localStorage.getItem('ti_lang')||'es';

const eq=document.getElementById('eq');
for(let i=0;i<40;i++){const s=document.createElement('span');s.style.animationDelay=(i*0.06)+'s';s.style.animationDuration=(1+(i%5)*0.15)+'s';eq.appendChild(s);}

const main=document.getElementById('main');
const legend=document.getElementById('legend');

function applyUI(){
  const t=UI[LANG];
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
  document.getElementById('search').placeholder=t.searchph;
  const chips=document.querySelectorAll('#chips .chip');
  chips[0].textContent=t.f_all;chips[1].textContent=t.f_real;chips[2].textContent=t.f_music;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('active',b.dataset.l===LANG));
  legend.innerHTML='';
  Object.values(REGIONS).forEach(r=>{
    const s=document.createElement('span');
    s.innerHTML=`<i style="background:${r.color}"></i>${r[LANG].split(' — ')[0]}`;
    legend.appendChild(s);
  });
}

function render(){
  main.innerHTML='';
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.querySelector('#chips .chip.active').dataset.f;
  const t=UI[LANG];
  let shown=0;
  Object.entries(REGIONS).forEach(([key,reg])=>{
    if(f!=='all'&&reg.world!==f)return;
    let items=ENV.filter(e=>e.r===key);
    if(q)items=items.filter(e=>((LANG==='es'?e.nes+e.des+e.ees:e.nen+e.den+e.een)).toLowerCase().includes(q));
    if(!items.length)return;
    shown+=items.length;
    const sec=document.createElement('section');
    sec.className='region';
    sec.innerHTML=`<div class="region-head"><span class="region-dot" style="background:${reg.color}"></span><h2>${reg[LANG]}</h2></div>
      <div class="region-sub">${LANG==='es'?reg.subes:reg.suben}</div><div class="grid"></div>`;
    const grid=sec.querySelector('.grid');
    items.forEach(e=>{
      const c=document.createElement('div');c.className='card';c.style.setProperty('--accent',reg.color);
      c.innerHTML=`<div class="card-top"><h3>${LANG==='es'?e.nes:e.nen}</h3>${e.star?'<span class="star" title="Prioridad de diseño">★</span>':''}</div>
        <div class="tags"><span class="tag intext">${e.intext}</span><span class="tag">${LANG==='es'?e.tes:e.ten}</span></div>
        <p>${LANG==='es'?e.des:e.den}</p>
        <div class="elems"><b>${t.elems}</b> ${LANG==='es'?e.ees:e.een}</div>`;
      grid.appendChild(c);
    });
    main.appendChild(sec);
  });
  if(!shown)main.innerHTML=`<div class="empty">${t.empty}</div>`;
}

document.getElementById('st-total').textContent=ENV.length;
document.getElementById('search').addEventListener('input',render);
document.getElementById('chips').addEventListener('click',e=>{
  if(!e.target.classList.contains('chip'))return;
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');render();
});
document.getElementById('lang').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  LANG=e.target.dataset.l;localStorage.setItem('ti_lang',LANG);
  applyUI();render();
});
applyUI();render();
</script>
